<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tesorería Escolar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Las tipografias NO bloquean el pintado: media="print" hace que el navegador
     las baje sin esperarlas, y al llegar se aplican. Si Google no contesta, la
     aplicacion se ve igual con la tipografia del telefono. Nunca en blanco. -->
<link rel="stylesheet" media="print" onload="this.media='all';this.onload=null"
      href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
:root{--paper:#EFF2F5;--card:#FFFFFF;--ink:#13202B;--muted:#5C6B78;--line:#DFE5EA;
--a:#4C6EF5;--b:#E09B2D;--c:#CE4C7C;--pos:#12806A;--neg:#B8402F;--shade:#13202B;--radius:14px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0E161D;--card:#17222C;--ink:#E9EFF3;--muted:#93A3AF;--line:#26333F;--a:#7B94F8;--b:#EFB255;--c:#E6789F;--pos:#38B996;--neg:#E0705C;--shade:#C6D2DB}}
*{box-sizing:border-box}html,body{margin:0;padding:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,.num{font-family:"Familjen Grotesk","Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding:18px 14px 56px}
button:focus-visible,select:focus-visible,input:focus-visible,.pcard:focus-visible{outline:2px solid var(--a);outline-offset:2px}
#login{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:20px}
#login .box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px 22px;width:100%;max-width:380px}
#login h1{font-size:25px;margin:0;letter-spacing:-0.02em}
#login .sub{color:var(--muted);font-size:13.5px;margin:4px 0 20px}
.inp{margin-bottom:12px}
.inp label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:5px}
.inp input,.inp select{width:100%;font:inherit;font-size:15px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink)}
.err{color:var(--neg);font-size:13px;margin:4px 0 8px}
.pw{position:relative}.pw input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:transparent;color:var(--muted);cursor:pointer;padding:9px;display:flex;border-radius:8px}
.eye svg{width:19px;height:19px;display:block}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:14px}
header h1{font-size:20px;font-weight:600;margin:0;letter-spacing:-0.015em}
.sub{color:var(--muted);font-size:13px;margin-top:2px}
.who-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-size:13px;padding:7px 12px;border-radius:999px;cursor:pointer}
.tabs{display:flex;gap:6px;margin:0 0 12px;background:var(--card);padding:4px;border-radius:11px;border:1px solid var(--line)}
.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font:inherit;font-weight:500;padding:8px 6px;border-radius:8px;cursor:pointer;font-size:13.5px}
.tabs button[aria-selected="true"]{background:var(--shade);color:var(--card)}
.chips{display:flex;gap:7px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.chip{white-space:nowrap;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:13.5px;padding:7px 13px;border-radius:999px;cursor:pointer;flex:0 0 auto}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink);font-weight:500}
.filtro{display:flex;gap:8px;align-items:center;margin-bottom:14px}
.filtro select{flex:1;font:inherit;font-size:13.5px;padding:9px 11px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.hero .label{color:var(--muted);font-size:13px}
.hero-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.hero .big{font-size:40px;font-weight:600;line-height:1.05;margin:4px 0 2px;letter-spacing:-0.03em}
.hero .big.neg{color:var(--neg)}
.hero .note{font-size:13px;color:var(--muted)}
.bar{height:11px;border-radius:6px;background:var(--line);overflow:hidden;display:flex;margin-top:14px}
.bar i{display:block;height:100%}.bar .spent{background:var(--shade)}.bar .left{background:var(--pos)}
.legend{display:flex;gap:16px;margin-top:9px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:3px;display:inline-block}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:13px 14px}
.stat .k{font-size:12.5px;color:var(--muted);line-height:1.3}
.stat .v{font-size:22px;font-weight:600;margin-top:5px;letter-spacing:-0.02em}
.stat .brk{font-size:11.5px;color:var(--muted);margin-top:5px;line-height:1.35;font-weight:400}
.stat.link{cursor:pointer}
.stat.link:hover{border-color:var(--muted)}
.stat .go{font-size:11.5px;color:var(--a);font-weight:600;margin-top:6px}
h2{font-size:14px;font-weight:600;margin:20px 0 9px;color:var(--muted)}
.salon{display:flex;align-items:center;gap:11px;padding:11px 0;border-bottom:1px solid var(--line)}
.salon:last-child{border-bottom:0}
.salon .tag{width:44px;font-weight:600;font-size:13.5px;flex:0 0 auto;font-family:"Familjen Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
.salon .who{font-size:11.5px;color:var(--muted);margin-top:2px;font-family:"Public Sans",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:400}
.salon .track{flex:1;height:7px;background:var(--line);border-radius:4px;overflow:hidden}
.salon .track i{display:block;height:100%;border-radius:4px}
.salon .amt{font-weight:600;font-size:14.5px;min-width:80px;text-align:right;font-variant-numeric:tabular-nums}
.salon .amt small{display:block;font-weight:400;font-size:11px;color:var(--muted);white-space:nowrap}
.salon input{font:inherit;font-size:14px;font-weight:600;text-align:right;width:90px;border:0;border-bottom:1px dashed var(--line);background:transparent;color:var(--ink);padding:3px 2px;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:500;color:var(--muted);font-size:12px;padding:0 0 8px;border-bottom:1px solid var(--line)}
td{padding:11px 0;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td.money,th.money{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.desc{font-weight:500}.meta{color:var(--muted);font-size:12px;margin-top:2px}
.tick{border:0;background:transparent;color:var(--a);font:inherit;font-size:12px;font-weight:600;padding:4px 0 0;cursor:pointer}
.tick.falta{color:var(--neg)}
.tfoot{display:flex;justify-content:space-between;align-items:baseline;padding-top:13px;margin-top:3px;border-top:2px solid var(--ink)}
.tfoot .v{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);font-size:13.5px;padding:18px 0;text-align:center}
.field{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.field:last-of-type{border-bottom:0}
.field label{font-size:13.5px;color:var(--muted)}
.field input,.field select{font:inherit;font-size:14px;text-align:right;border:0;background:transparent;color:var(--ink);border-bottom:1px dashed var(--line);padding:3px 2px;max-width:180px;width:100%;font-variant-numeric:tabular-nums}
.field select{text-align-last:right}
.field input:disabled,.field select:disabled{border-bottom-color:transparent;color:var(--muted);opacity:1}
.conc{display:grid;grid-template-columns:1fr 54px 78px 26px;gap:8px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.conc input{font:inherit;font-size:13.5px;border:0;background:transparent;color:var(--ink);border-bottom:1px dashed var(--line);padding:4px 2px;width:100%}
.conc input.n{text-align:right;font-variant-numeric:tabular-nums}
.conc input:disabled{border-bottom-color:transparent;color:var(--muted);opacity:1}
.conc .head{color:var(--muted);font-size:11.5px}
/* Un número que se toca para editarlo. Se ve igual que el campo que
   reemplazó —misma raya punteada abajo— para que la pantalla no brinque
   y para que siga leyéndose como algo editable. */
.numbtn{font:inherit;background:transparent;color:var(--ink);border:0;border-bottom:1px dashed var(--line);padding:3px 2px;cursor:pointer;text-align:right;width:100%;font-variant-numeric:tabular-nums}
.numbtn:disabled{border-bottom-color:transparent;color:var(--muted);cursor:default}
.salon .numbtn{font-size:14px;font-weight:600;width:90px;flex:0 0 auto}
.field .numbtn{font-size:14px;max-width:180px}
.conc .numbtn{font-size:13.5px}
/* La ruedita de "estoy guardando". Sin esto la pantalla se queda quieta
   mientras viaja la petición y no hay forma de saber si ya. */
.giro{display:inline-block;width:12px;height:12px;margin-right:7px;vertical-align:-1px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:giro .7s linear infinite}
@keyframes giro{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.giro{animation-duration:2.4s}}
.del{border:0;background:transparent;color:var(--muted);font-size:17px;cursor:pointer;padding:0 4px;line-height:1}
.del:hover,.del:focus-visible{color:var(--neg)}
.del:disabled{opacity:.5;cursor:default}
.conc .del{padding:0}
td .del{font-size:19px}
.addrow{margin-top:10px;border:1px dashed var(--line);background:transparent;color:var(--muted);font:inherit;font-size:13px;padding:9px;width:100%;border-radius:9px;cursor:pointer}
.result{display:flex;justify-content:space-between;align-items:baseline;margin-top:6px;padding:12px 0 0;border-top:2px solid var(--ink)}
.result .v{font-size:24px;font-weight:600;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:500;padding:4px 10px;border-radius:999px;white-space:nowrap}
.badge.open{background:color-mix(in srgb,var(--b) 18%,transparent);color:var(--b)}
.badge.closed{background:color-mix(in srgb,var(--pos) 16%,transparent);color:var(--pos)}
.badge.none{background:var(--line);color:var(--muted)}
.badge.tipo{background:var(--line);color:var(--muted);font-weight:500}
.badge.solo{background:color-mix(in srgb,var(--c) 15%,transparent);color:var(--c);font-weight:500}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:140px;border:0;background:var(--shade);color:var(--card);font:inherit;font-weight:600;font-size:14px;padding:12px;border-radius:10px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-weight:500}
.btn.danger{background:var(--neg);color:#fff}
.btn.wide{width:100%}
.hint{font-size:12.5px;color:var(--muted);margin-top:12px}
.lockmsg{background:color-mix(in srgb,var(--b) 12%,transparent);border-radius:10px;padding:11px 13px;font-size:13px;margin-top:12px}
.lend{background:color-mix(in srgb,var(--a) 11%,transparent);border-radius:10px;padding:11px 13px;font-size:13px;margin-bottom:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.lend button{border:0;background:transparent;color:var(--a);font:inherit;font-size:13px;font-weight:600;cursor:pointer;padding:0;white-space:nowrap}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;cursor:pointer}
.pcard:hover{border-color:var(--muted)}
.pcard-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.pcard-nom{font-family:"Familjen Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-weight:600;font-size:16px;letter-spacing:-0.01em}
/* Tarjeta de persona plegada. Es un <details> de verdad y no un div con
   una clase: así el teclado, el lector de pantalla y el buscador del
   navegador ya saben qué es, sin que haya que enseñárselos. */
details.pcard{padding:0}
details.pcard>summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;align-items:center;gap:10px;border-radius:var(--radius)}
details.pcard>summary::-webkit-details-marker{display:none}
details.pcard>summary:focus-visible{outline:2px solid var(--ink);outline-offset:-2px}
details.pcard>summary .quien{flex:1;min-width:0}
details.pcard>summary .quien .meta{margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
details.pcard>summary .chev{flex:0 0 auto;width:16px;height:16px;color:var(--muted);transition:transform .18s ease}
details.pcard[open]>summary .chev{transform:rotate(90deg)}
details.pcard[open]>summary{border-bottom:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
details.pcard .cuerpo{padding:2px 16px 16px}
@media (prefers-reduced-motion:reduce){details.pcard>summary .chev{transition:none}}
.pcard-bot{display:flex;justify-content:space-between;align-items:baseline;margin-top:10px;font-size:13px;color:var(--muted)}
.pcard-ok{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;color:var(--pos)}
.pcard-lend{margin-top:10px;padding-top:9px;border-top:1px solid var(--line);font-size:12.5px;color:var(--a)}
.volver{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);
  color:var(--ink);font:inherit;font-size:13.5px;font-weight:500;padding:9px 15px 9px 12px;border-radius:999px;
  cursor:pointer;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.volver:hover{border-color:var(--muted)}
.volver svg{width:16px;height:16px;flex:0 0 auto}
.toast{position:fixed;left:14px;right:14px;bottom:16px;max-width:520px;margin:0 auto;background:var(--shade);color:var(--card);padding:13px 16px;border-radius:11px;font-size:13.5px;box-shadow:0 8px 28px rgba(0,0,0,.22);z-index:90}
.modal{position:fixed;inset:0;background:rgba(6,14,20,.6);display:flex;align-items:center;justify-content:center;z-index:80;padding:18px;overflow-y:auto}
.modal .box{background:var(--card);border-radius:16px;padding:20px;width:100%;max-width:400px;box-shadow:0 14px 44px rgba(0,0,0,.3);margin:auto}
.modal h3{margin:0 0 6px;font-size:18px;font-weight:600;letter-spacing:-0.01em}
.modal p{margin:0 0 4px;font-size:14px;color:var(--muted);line-height:1.45}
.ticket-img{width:100%;border-radius:11px;border:1px solid var(--line);margin:14px 0 4px;display:block}
.dropzone{border:1px dashed var(--line);border-radius:11px;padding:26px 14px;text-align:center;color:var(--muted);font-size:13.5px;margin:14px 0 4px}
footer{color:var(--muted);font-size:12px;text-align:center;margin-top:26px;line-height:1.6}
.ver{position:fixed;right:10px;bottom:10px;z-index:40;font-family:"Familjen Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  font-size:10.5px;font-weight:600;letter-spacing:.02em;color:var(--muted);background:var(--card);
  border:1px solid var(--line);border-radius:999px;padding:3px 9px;opacity:.75;pointer-events:none}
.copy{border:0;background:transparent;color:var(--muted);font:inherit;font-size:11.5px;line-height:1.5;
  text-align:center;cursor:pointer;padding:10px 0 0;text-decoration:underline;text-underline-offset:3px;
  text-decoration-color:var(--line);display:block;width:100%}
.copy:hover{color:var(--ink)}
.legal{max-height:62vh;overflow-y:auto;margin:14px 0 4px;padding-right:4px}
.legal h4{font-family:"Familjen Grotesk",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:13.5px;font-weight:600;margin:16px 0 5px;color:var(--ink)}
.legal h4:first-child{margin-top:0}
.legal p{font-size:12.5px;line-height:1.55;margin:0 0 8px;color:var(--muted)}
.modal .box.ancho{max-width:520px}
@media (max-width:420px){.hero .big{font-size:34px}}
@media (prefers-reduced-motion:no-preference){.bar i,.salon .track i{transition:width .35s ease}}
</style>
</head>
<body>

<div class="ver" id="ver" aria-hidden="true"></div>

<div id="login">
  <div class="box">
    <h1>Tesorería Escolar</h1>
    <p class="sub">Eventos de generación y del salón</p>
    <div class="inp"><label for="lu">Usuario</label><input id="lu" autocomplete="username" autocapitalize="characters"></div>
    <div class="inp"><label for="lp">Contraseña</label>
      <div class="pw"><input id="lp" type="password" autocomplete="current-password">
        <button class="eye" id="eye" type="button" onclick="verPass()" aria-label="Mostrar contraseña" aria-pressed="false"></button></div></div>
    <div class="err" id="lerr" hidden></div>
    <button class="btn wide" onclick="entrar()">Entrar</button>
    <button class="copy" onclick="avisoLegal()">© 2026 Servicios FTS S.A. de C.V. y FTS Full Technology Systems LLC.<br>Todos los derechos reservados.</button>
  </div>
</div>

<div class="wrap" id="app" hidden>
  <header>
    <div><h1 id="hTit">Tesorería</h1><div class="sub" id="whoSub"></div></div>
    <button class="who-btn" onclick="salir()">Salir</button>
  </header>
  <div class="tabs" role="tablist" id="tabs"></div>
  <section id="view"></section>
  <footer>
    <button class="copy" id="btnMiPass" onclick="miPassword()">Cambiar mi contraseña</button><br>
    <button class="copy" onclick="avisoLegal()">© 2026 Servicios FTS S.A. de C.V. y FTS Full Technology Systems LLC.<br>Todos los derechos reservados.</button>
  </footer>
</div>

<script>
const VERSION='V1.19';

/* =========================================================
   CAPA API — habla con n8n. Cada función es un fetch al
   webhook, y el webhook es quien valida: aquí no se decide
   ningún permiso, solo se pinta.

   DB dejó de ser la base de datos y es la CACHÉ en memoria
   de lo que el servidor dejó ver. Se llena de un golpe con
   api.cargar() y se refresca después de cada cambio. Por eso
   las vistas no cambiaron ni una línea: siguen leyendo DB.
   ========================================================= */

const API='https://primary-production-5c3c.up.railway.app/webhook/tes';
const LLAVE_SESION='tes_sesion';

const DB={ciclo:null,ciclos:[],usuarios:[],presupuestos:[],eventos:[]};
let TOKEN=null;

/* Una sola puerta para TODAS las respuestas. Clasificar aquí y no en
   cada llamador es lo que permite que una llave de sesión muerta no se
   confunda con "no hay internet": son cosas distintas y llevan a
   acciones distintas —volver a entrar, o esperar—, y juntarlas elige
   la peor de las dos por omisión. */
async function pide(ruta,accion,datos){
  let r;
  try{
    r=await fetch(API+'/'+ruta,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({token:TOKEN,accion,datos:datos||{}})});
  }catch(e){
    const err=new Error('No se pudo conectar. Revisa tu internet y vuelve a intentar.');
    err.clase='red';throw err;
  }
  let j=null;
  try{ j=await r.json(); }catch(e){ j=null; }

  if(!r.ok&&!j){
    const err=new Error('El servidor no contestó bien. Vuelve a intentar en un momento.');
    err.clase='servidor';throw err;
  }
  /* 200 con el cuerpo VACÍO. Pasa cuando el workflow corre pero se queda
     a medias y n8n cierra la petición por su cuenta — le ocurrió al login
     el 17-sep-2026. Tiene su propio mensaje porque el genérico de abajo
     dice "no se pudo guardar el cambio", que al entrar es sencillamente
     falso: no se estaba guardando nada. Un mensaje equivocado manda a
     buscar el problema al lugar equivocado. */
  if(r.ok&&!j){
    const err=new Error('El servidor contestó vacío. No es tu internet: avisa que revisen el flujo.');
    err.clase='servidor';throw err;
  }
  if(j&&j.ok)return j;

  const cod=(j&&j.error)||'ERROR';
  /* Sesión muerta: se borra SOLO la llave de sesión y se manda a
     entrar otra vez. Reintentar con un token vencido no arregla nada,
     y pedirle a alguien que abra la consola del navegador tampoco. */
  if(/^TOKEN_|^PERSONA_NO_EXISTE$|^SIN_MEMBRESIA|^CUENTA_DESACTIVADA$|^SIN_CICLO_ACTIVO$/.test(cod)){
    try{ localStorage.removeItem(LLAVE_SESION); }catch(e){}
    TOKEN=null;
    const err=new Error(MENSAJES[cod]||'Tu sesión terminó. Vuelve a entrar.');
    err.clase='sesion';throw err;
  }
  const err=new Error((j&&j.mensaje)||MENSAJES[cod]||'No se pudo guardar el cambio.');

     Se decide por DOS caminos, y con que uno diga que sí basta:

       · el `id` que vuelve YA ESTABA entre los gastos del evento antes

     quien captura concluye que hay dos. Con el botón de eliminar a un
     lado, eso invita a borrar el único que quedó. */
  async addGasto(e,g){

    const j=await pide('tesoreria','gasto_crear',

       1. se pide al servidor una URL firmada de subida
       2. el celular sube el archivo DIRECTO al bucket
       3. se guarda nada más la llave
     Si el paso 2 falla, no se guarda la llave: no queda un ticket que
     se ve en pantalla y no se puede abrir. */
  async subirTicket(e,gid,archivo){
    const f=await pide('tesoreria','ticket_subir_url',
      {evento_id:e,gasto_id:gid,nombre:archivo.name});
    let r;
    try{
      r=await fetch(f.url,{method:'PUT',body:archivo,
        headers:{'Content-Type':archivo.type||'application/octet-stream'}});
    }catch(err){
      /* Aquí el fetch LANZÓ, o sea que no hubo respuesta que mirar. Eso
         pasa por dos motivos muy distintos y hay que separarlos, porque
         llevan a acciones distintas:

           · sin señal            → volver a intentar sirve
           · el navegador lo cortó → volver a intentar NO sirve nunca

         Lo segundo es lo que pasó el 17-sep-2026: el bucket no tenía
         ninguna regla de CORS, así que su verificación previa contestaba
         200 sin una sola cabecera access-control-*, el navegador cortaba
         el PUT antes de mandarlo, y el mensaje de entonces —«revisa tu
         internet»— mandó a buscar el problema al lugar equivocado.

         `navigator.onLine` en false es prueba de que no hay red; en true
         no prueba nada (dice que hay tarjeta de red, no que haya paso),
         así que solo se usa para el caso claro. */
      const sinRed = (typeof navigator !== 'undefined' && navigator.onLine === false);
      const x = sinRed
        ? new Error('Sin conexión. La foto no salió de tu teléfono: vuelve a intentar cuando tengas señal.')
        : new Error('El almacén de fotos rechazó la subida antes de empezar. No es tu internet — repórtalo para que revisen los permisos del almacén.');
      x.clase = sinRed ? 'red' : 'servidor';
      throw x;
    }
    if(!r.ok){ const x=new Error('El archivo no se pudo guardar. Vuelve a intentar.');x.clase='servidor';throw x; }
    await pide('tesoreria','ticket_fijar',
      {evento_id:e,gasto_id:gid,ticket_key:f.ticket_key,nombre:archivo.name});
    await refresca();
  },
  async quitarTicket(e,gid){
    await pide('tesoreria','ticket_fijar',{evento_id:e,gasto_id:gid,ticket_key:null});
    await refresca();
  },

  async verTicketUrl(e,gid){

     equipo, ni siquiera hacia nuestro propio servidor. (En el login sí

  async crearPersona(d){

/* PBKDF2-SHA256, 100 000 vueltas, con sal nueva cada vez. Mismo formato
   que usa el servidor: pbkdf2$<vueltas>$<sal>$<derivado>, todo en
   base64url. Lo hace WebCrypto, que ya trae el navegador. */
async function revuelve(clave){
  const sal=crypto.getRandomValues(new Uint8Array(16));
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(clave),'PBKDF2',false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:sal,iterations:100000,hash:'SHA-256'},k,256);
  return 'pbkdf2$100000$'+b64u(sal)+'$'+b64u(new Uint8Array(bits));
}
function b64u(bytes){
  let s='';for(const b of bytes)s+=String.fromCharCode(b);
  return btoa(s).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}

}

function modal(html,setup){

  m.innerHTML=`<div class="box">${html}</div>`;
  const cierra=()=>{m.remove();document.removeEventListener('keydown',tecla)};

/* Apaga un botón y dice qué está pasando mientras viaja la petición.
   Devuelve la función que lo revive, con el texto que TENÍA — no uno
   inventado, que es como un botón acaba mintiendo después de un fallo. */
function ocupa(boton,texto,otros){
  const antes=boton.innerHTML;
  const todos=[boton].concat(otros||[]).filter(Boolean);
  todos.forEach(b=>b.disabled=true);
  boton.innerHTML=`<span class="giro" aria-hidden="true"></span>${esc(texto)}`;
  return ()=>{todos.forEach(b=>b.disabled=false);boton.innerHTML=antes};
}

             inputmode="${o.entero?'numeric':'decimal'}" value="${val}"></div>
    <p class="hint" id="en-err" hidden></p>
    <div class="actions"><button class="btn ghost" data-no>Cancelar</button>
      <button class="btn" data-si>Guardar</button></div>`,
  (m,cierra)=>{
    const inp=m.querySelector('#en-v'),si=m.querySelector('[data-si]'),
          no=m.querySelector('[data-no]'),err=m.querySelector('#en-err');
    no.onclick=cierra;
    const guarda=async()=>{
      const v=Number(inp.value);
      if(!isFinite(v)||v<0){
        err.textContent='Escribe un número de cero para arriba.';err.hidden=false;inp.focus();return;
      }
      err.hidden=true;
      const revive=ocupa(si,'Guardando…',[no,inp]);
      try{
        await o.guarda(o.entero?Math.round(v):v);
        cierra();draw();toast(o.ok||'Listo.');
      }catch(e){
        revive();err.textContent=e.message;err.hidden=false;falloSesion(e);
      }
    };
    si.onclick=guarda;
    inp.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();guarda()}};
    inp.focus();inp.select();
  });
}

function confirmar(titulo,texto,accion='Eliminar'){
  return new Promise(res=>{
    modal(`<h3>${esc(titulo)}</h3><p>${esc(texto)}</p>
      <div class="actions"><button class="btn ghost" data-no>Cancelar</button>
      <button class="btn danger" data-si>${esc(accion)}</button></div>`,
    (m,c)=>{m.querySelector('[data-no]').onclick=()=>{c();res(false)};
            m.querySelector('[data-si]').onclick=()=>{c();res(true)};
            m.querySelector('[data-no]').focus()});
  });
}

/* Un renglón para el motivo, DENTRO del cuadro. Se crea solo si no
   estaba: así ningún cuadro tuvo que cambiar su plantilla para ganar
   manejo de errores. Va antes de los botones, que es donde se mira. */
function cajaError(m){
  let e=m.querySelector('[data-err]');
  if(!e){
    e=document.createElement('p');e.className='hint';e.setAttribute('data-err','');e.hidden=true;
    const acc=m.querySelector('.actions');
    if(acc)acc.parentNode.insertBefore(e,acc); else m.querySelector('.box').appendChild(e);
  }
  return e;
}

/* ===== el botón de un cuadro que ESCRIBE =====

   Todos los cuadros hacían lo mismo y estaba mal de la misma forma:
   cerrar el cuadro y DESPUÉS mandar la petición. Durante el viaje la
   pantalla se ve exactamente igual que antes —nada girando, nada
   deshabilitado, el renglón todavía ahí— y eso es una invitación a
   picarle otra vez. Así se duplicó el gasto 7 el 17-sep: dos toques con
   1.482 segundos de diferencia.

   Aquí el cuadro se queda abierto hasta que el servidor conteste. Si
   falla, no se cierra: se queda con lo tecleado y el motivo debajo.

   o = {valida, tarea, ok, enCurso, luego} */
function alGuardar(m,cierra,o){
  const si=m.querySelector('[data-si]'),no=m.querySelector('[data-no]'),err=cajaError(m);
  if(no)no.onclick=cierra;
  si.onclick=async()=>{
    err.hidden=true;
    const falla=o.valida?o.valida():null;
    if(falla){err.textContent=falla;err.hidden=false;return}
    const revive=ocupa(si,o.enCurso||'Guardando…',[no]);
    try{
      const r=await o.tarea();
      cierra();
      if(o.luego)o.luego(r); else draw();
      if(o.ok)toast(typeof o.ok==='function'?o.ok(r):o.ok);
    }catch(e){
      revive();err.textContent=e.message;err.hidden=false;falloSesion(e);
    }
  };
}

/* Confirmar algo que BORRA. Igual que alGuardar, pero con el texto y el
   botón rojo de confirmar(). La diferencia con confirmar() es justo la
   que faltaba: aquel cierra el cuadro al decir que sí y solo entonces
   manda la petición, así que un borrado viajaba sin que nada en la
   pantalla lo dijera. */
/* Escribir desde un botón que NO abre cuadro. El indicador va en el
   botón mismo, que llega por `this` desde el onclick. Estos tres
   —Confirmar, Devolver, Agregar concepto— no tenían ni indicador ni
   catch: un fallo era una promesa rechazada que nadie veía. */
async function enBoton(b,texto,tarea,ok){
  if(b&&b.disabled)return;
  const revive=b?ocupa(b,texto):()=>{};
  try{ const r=await tarea(); revive(); draw(); if(ok)toast(typeof ok==='function'?ok(r):ok); }
  catch(e){ revive(); toast(e.message); falloSesion(e); }
}

function confirmarYHacer(o){
  modal(`<h3>${esc(o.titulo)}</h3><p>${esc(o.texto)}</p>
    <p class="hint" data-err hidden></p>
    <div class="actions"><button class="btn ghost" data-no>Cancelar</button>
      <button class="btn danger" data-si>${esc(o.accion||'Eliminar')}</button></div>`,
  (m,cierra)=>{
    alGuardar(m,cierra,{tarea:o.tarea,ok:o.ok,enCurso:o.enCurso||'Eliminando…',luego:o.luego});
    m.querySelector('[data-no]').focus();
  });
}

/* ================= tesorería ================= */
function agrega(evs){
  /* Se arma desde SALONES, no con A/B/C quemadas. Con un cuarto grupo,
     la versión vieja lo sumaba como cero y el total lo ignoraba: el
     tablero enseñaba MENOS dinero del real y sin marcar error. */
  const rec={},per={};
  SALONES.forEach(s=>{rec[s.id]=0;per[s.id]=vacioPers()});
  let presup=0,gas=0,gastos=[],ad=0,ni=0,na=0,pad=0,pni=0,pna=0;
  evs.forEach(e=>{
    SALONES.forEach(s=>{rec[s.id]+=(e.rec[s.id]||0);
      const o=e.pers[s.id]||vacioPers();
      per[s.id].ad+=o.ad||0;per[s.id].ni+=o.ni||0;per[s.id].na+=o.na||0;
      ad+=o.ad||0;ni+=o.ni||0;na+=o.na||0});
    const P=presDeEvento(e);if(P){presup+=totPres(P);pad+=P.adultos||0;pni+=P.ninos||0;pna+=P.ninas||0}
    e.gastos.forEach(g=>{gas+=g.m;gastos.push({...g,ev:e.nom,evId:e.id})});
  });
  gastos.sort((x,y)=>y.f.localeCompare(x.f));
  return {presup,gas,rec,per,gastos,ad,ni,na,pad,pni,pna,
          total:SALONES.reduce((t,s)=>t+(rec[s.id]||0),0),pers:ad+ni+na};
}

function alcanceActual(){
  if(fAlc!=='auto')return fAlc;
  return puedeVerTodos()?'todos':'gen+'+ses.salon;
}
function opcionesAlcance(){
  if(puedeVerTodos()){
    return [{v:'todos',n:'Todos los eventos'},{v:'gen',n:'Solo los de generación'}]
      .concat(SALONES.map(s=>({v:'gen+'+s.id,n:'Generación más '+s.nom})))
      .concat(SALONES.map(s=>({v:'solo'+s.id,n:'Solo los de '+s.nom})));
  }
  const m=ses.salon;
  return [{v:'gen+'+m,n:'Generación más '+nomSalon(m)},
          {v:'gen',n:'Solo los de generación'},
          {v:'solo'+m,n:'Solo los de '+nomSalon(m)}];
}
function aplicaAlcance(lista){
  const a=alcanceActual();
  if(a==='todos')return lista;
  if(a==='gen')return lista.filter(e=>e.tipo==='generacion');
  if(a.startsWith('gen+')){const s=a.slice(4);return lista.filter(e=>e.tipo==='generacion'||e.salon===s)}
  if(a.startsWith('solo')){const s=a.slice(4);return lista.filter(e=>e.tipo==='salon'&&e.salon===s)}
  return lista;
}
function copiaClabe(c){
  navigator.clipboard?.writeText(c).then(()=>toast('CLABE copiada.'),()=>toast('No se pudo copiar. Cópiala a mano.'));

function verDesglose(){

    tab='pre';volverA='tes';preView='lista';pintaTabs();draw();window.scrollTo(0,0);return;
  }
  const P=presDeEvento(uno);
  if(!P)return toast('Este evento no tiene presupuesto ligado.');
  preId=P.id;preView='detalle';volverA='tes';tab='pre';pintaTabs();draw();window.scrollTo(0,0);
}

/* ================= tickets ================= */
function verTicket(eId,gId){
  const e=ev(eId),g=e.gastos.find(x=>x.id===gId),puede=puedeTicket(e);
  /* La foto no viene con los datos: se pide su URL firmada al abrir
     este modal y vive 5 minutos. El <img> se llena cuando llega. */
  const cuerpo=g.ticket
    ?`<img class="ticket-img" id="tk-img" alt="Ticket de ${esc(g.d)}" hidden>
      <div class="dropzone" id="tk-cargando">Cargando la foto…</div>
      <p>${esc(g.ticket.nombre)} · lo subió ${esc(g.ticket.por)} el ${fchHora(g.ticket.cuando)}</p>`
    :`<div class="dropzone">Todavía no hay ticket de este gasto.</div>`;
  /* `capture` abre la cámara en el celular, pero en varios navegadores
     TAPA la galería: el que lo lleva no puede elegir una foto que ya
     tomó. Por eso van dos entradas de archivo y dos botones, no un
     `capture` en la única que había.

     El botón de cámara solo se ofrece donde hay dedo (`pointer: coarse`).
     En una laptop `capture` se ignora y el botón abriría el mismo
     explorador de archivos que el otro: dos botones para lo mismo. */
  const conCamara = (typeof matchMedia === 'function') && matchMedia('(pointer: coarse)').matches;
  const rotulo = g.ticket ? 'Cambiar foto' : 'Cargar ticket';
  const acciones=puede
    ?`<div class="actions">
        ${g.ticket?`<button class="btn danger" data-del>Quitar</button>`:''}
        ${conCamara?`<button class="btn ghost" data-cam>Tomar foto</button>`:''}
        <button class="btn" data-up>${conCamara?'Elegir archivo':rotulo}</button></div>
      ${g.ticket?`<p class="hint">La foto nueva reemplaza a la de ahora.</p>`:''}`
    :`<p class="hint">${g.ticket?'Solo quien lleva la tesorería de este evento puede cambiarlo.':'Solo quien lleva la tesorería de este evento puede cargarlo.'}</p>`;
  modal(`<h3>${esc(g.d)}</h3><p>${esc(g.p)} · ${fch(g.f)} · ${mx(g.m)}</p>${cuerpo}
    <input type="file" accept="image/*" id="tk-file" hidden>
    <input type="file" accept="image/*" capture="environment" id="tk-cam" hidden>${acciones}
    <div class="actions"><button class="btn ghost" data-close>Cerrar</button></div>`,
  (m,cierra)=>{
    m.querySelector('[data-close]').onclick=cierra;
    const up=m.querySelector('[data-up]'),del=m.querySelector('[data-del]');
    const cam=m.querySelector('[data-cam]');
    const file=m.querySelector('#tk-file'),foto=m.querySelector('#tk-cam');

    if(g.ticket){
      const img=m.querySelector('#tk-img'),cargando=m.querySelector('#tk-cargando');
      api.verTicketUrl(eId,gId).then(u=>{
        img.onload=()=>{img.hidden=false;cargando.remove()};
        img.onerror=()=>{cargando.textContent='La foto no se pudo abrir. Cierra y vuelve a intentar.'};
        img.src=u;
      }).catch(err=>{cargando.textContent=err.message;falloSesion(err)});
    }

    if(up)up.onclick=()=>file.click();
    if(cam)cam.onclick=()=>foto.click();

    /* Las dos entradas suben igual. El texto del botón se GUARDA antes
       de cambiarlo: antes se restauraba siempre a 'Cargar ticket', y al
       fallar un reemplazo el botón se quedaba mintiendo. */
    const sube=async(entrada,boton)=>{
      const f=entrada.files[0];if(!f)return;
      if(f.size>8*1024*1024){entrada.value='';return toast('La foto pesa más de 8 MB. Tómala en menor calidad.')}
      const antes=boton.textContent;
      [up,cam].forEach(b=>{if(b)b.disabled=true});
      boton.textContent='Subiendo…';
      try{
        await api.subirTicket(eId,gId,f);
        cierra();draw();toast('Ticket cargado.');
      }catch(err){
        [up,cam].forEach(b=>{if(b)b.disabled=false});
        boton.textContent=antes;entrada.value='';
        toast(err.message);falloSesion(err);
      }
    };
    if(file)file.onchange=()=>sube(file,up);
    if(foto)foto.onchange=()=>sube(foto,cam||up);
    if(del)del.onclick=async()=>{
      if(!await confirmar('Quitar ticket',`Se va a borrar la foto del ticket de "${g.d}". El gasto se queda.`,'Quitar'))return;
      try{ await api.quitarTicket(eId,gId);cierra();draw();toast('Ticket quitado.'); }
      catch(err){ toast(err.message);falloSesion(err); }
    };
  });
}

/* Las tres puertas al cuadro de un número. Van aquí y no en el onclick
   porque el valor de ahora se vuelve a leer de DB al abrir: si alguien
   más lo movió mientras la pantalla estaba pintada, se edita sobre lo
   último, no sobre lo que se dibujó. */
function pideRecaudado(eId,gId,v){
  editaNumero({
    titulo:'Dinero recaudado', contexto:nomSalon(gId)+' · '+(ev(eId)||{}).nom,
    etiqueta:'Total que reportó el salón', valor:v,
    guarda:n=>api.setRecaudado(eId,gId,n), ok:'Recaudación actualizada.'});
}
function pidePres(campo,rotulo){
  const P=pres(preId); if(!P)return;
  editaNumero({
    titulo:rotulo, contexto:P.nom, etiqueta:'Cuántos', entero:true, valor:P[campo]||0,
    guarda:n=>api.setPres(preId,{[campo]:n}), ok:'Presupuesto actualizado.'});
}
function pideConcepto(i,campo){
  const P=pres(preId); if(!P)return;
  const k=P.c[i]; if(!k)return;
  const cant=campo==='q';
  editaNumero({
    titulo:cant?'Cantidad':'Precio unitario', contexto:k.d||'Concepto sin nombre',
    etiqueta:cant?'Cuántos':'Precio por unidad', entero:cant, valor:cant?k.q:k.u,
    guarda:n=>api.setConcepto(preId,i,campo,n), ok:'Concepto actualizado.'});
}

function editaPersonas(eId){
  const e=ev(eId),filas=salonesDe(e);
  modal(`<h3>Personas confirmadas</h3><p>${esc(e.nom)}. Estos números son los de la realidad, no los del presupuesto, y los puedes mover cuando cambien.</p>
    ${filas.map(s=>`<h2 style="margin:16px 0 4px">${s.nom}</h2>
      <div class="field"><label>Adultos</label><input type="number" min="0" id="pp-${s.id}-ad" value="${(e.pers[s.id]||{}).ad||0}"></div>
      <div class="field"><label>Niños</label><input type="number" min="0" id="pp-${s.id}-ni" value="${(e.pers[s.id]||{}).ni||0}"></div>
      <div class="field"><label>Niñas</label><input type="number" min="0" id="pp-${s.id}-na" value="${(e.pers[s.id]||{}).na||0}"></div>`).join('')}
    <p class="hint" id="pp-err" hidden></p>
    <div class="actions"><button class="btn ghost" data-no>Cancelar</button><button class="btn" data-si>Guardar</button></div>`,
  (m,cierra)=>{
    const si=m.querySelector('[data-si]'),no=m.querySelector('[data-no]'),
          err=m.querySelector('#pp-err');
    no.onclick=cierra;
    si.onclick=async()=>{
      /* Un salón por petición, así que mientras se guarda hay que decir
         algo: son varias idas al servidor, no una. Y si una falla, el
         cuadro se queda abierto con lo tecleado — antes no había catch y
         el error se perdía sin que nadie viera nada. */
      err.hidden=true;
      const revive=ocupa(si,'Guardando…',[no]);
      try{
        for(const s of filas){
          await api.setPersonas(eId,s.id,{
            ad:+m.querySelector(`#pp-${s.id}-ad`).value||0,
            ni:+m.querySelector(`#pp-${s.id}-ni`).value||0,
            na:+m.querySelector(`#pp-${s.id}-na`).value||0});
        }
        cierra();draw();toast('Personas actualizadas.');
      }catch(e){
        revive();err.textContent=e.message;err.hidden=false;falloSesion(e);
      }
    };
  });
}

  </div>`;
}
function listaPre(){
  const prestados=DB.presupuestos.filter(P=>ses.rol==='rep'&&vePres(P)&&prestamoVivo(P)&&P.prestamo.a===ses.salon&&P.salon!==ses.salon);
  let lista=DB.presupuestos.filter(vePres);
  if(fSalon!=='todos')lista=lista.filter(P=>P.salon===fSalon);
  if(fTipo!=='todos')lista=lista.filter(P=>P.tipo===fTipo);
  if(fEstado!=='todos')lista=lista.filter(P=>fEstado==='confirmado'?P.estado==='confirmado':P.estado!=='confirmado');
  lista.sort((a,b)=>a.fecha.localeCompare(b.fecha));
  return `
  <div class="filtro">
    <select onchange="fEstado=this.value;draw()" aria-label="Filtrar por estado">
      <option value="todos" ${fEstado==='todos'?'selected':''}>Todos los estados</option>
      <option value="creacion" ${fEstado==='creacion'?'selected':''}>En creación</option>
      <option value="confirmado" ${fEstado==='confirmado'?'selected':''}>Confirmados</option>
    </select>
    <select onchange="fTipo=this.value;draw()" aria-label="Filtrar por tipo">
      <option value="todos" ${fTipo==='todos'?'selected':''}>Todos los tipos</option>
      <option value="generacion" ${fTipo==='generacion'?'selected':''}>Toda la generación</option>
      <option value="salon" ${fTipo==='salon'?'selected':''}>De un salón</option>
    </select>
  </div>
  ${ses.rol==='admin'?`<div class="filtro">
    <select onchange="fSalon=this.value;draw()" aria-label="Filtrar por salón">
      <option value="todos" ${fSalon==='todos'?'selected':''}>Todos los salones</option>
      ${SALONES.map(x=>`<option value="${x.id}" ${fSalon===x.id?'selected':''}>Lo prepara ${x.nom}</option>`).join('')}
    </select>
  </div>`:''}

  ${prestados.length?`<h2>Prestados a ti</h2>${prestados.map(tarjeta).join('')}`:''}
  ${lista.length?lista.map(tarjeta).join(''):`<div class="card"><div class="empty">No hay presupuestos con ese filtro.</div></div>`}`;
}
function abrePre(id){
  const P=pres(id);
  if(!P||!vePres(P)){toast('Ese presupuesto es de otro salón.');preView='lista';draw();return}
  preId=id;preView='detalle';volverA='pre';draw();window.scrollTo(0,0);
}

  const P=pres(preId);
  if(!vePres(P)){preView='lista';return listaPre()}
  const conf=P.estado==='confirmado',admin=ses.rol==='admin';
  const dueno=ses.rol==='rep'&&P.salon===ses.salon;
  const puede=puedeEditarPres(P),dis=puede?'':'disabled';
  const total=totPres(P),kids=chamacos(P),cuota=kids>0?Math.ceil(total/kids/10)*10:0;
  const prest=prestamoVivo(P);
  let banner='';
  if(prest&&(dueno||admin))banner=`<div class="lend"><span>Prestado a ${nomSalon(P.prestamo.a)} hasta el ${fchHora(P.prestamo.hasta)}</span>
    <button onclick="terminaPrestamo()">Terminar</button></div>`;
  else if(prest&&ses.salon===P.prestamo.a)banner=`<div class="lend"><span>${nomSalon(P.salon)} te lo prestó hasta el ${fchHora(P.prestamo.hasta)}</span></div>`;
  let aviso='';
  if(conf&&puedeConfirmar(P))aviso=`<div class="lockmsg">Confirmado. Como tesorera de este evento puedes corregirlo aquí mismo, y lo que cambies entra directo al tablero.</div>`;
  else if(conf)aviso=`<div class="lockmsg">Ya está confirmado y el evento "${esc(P.nom)}" existe. Si necesitas cambiar algo, pídeselo a ${P.tipo==='salon'?nomSalon(P.salon):'Caro'}.</div>`;

  else if(!puede)aviso=`<div class="lockmsg">Este presupuesto lo lleva ${nomSalon(P.salon)}.</div>`;
  else if(P.tipo==='generacion'&&!admin)aviso=`<div class="lockmsg">Es de generación, así que Caro es quien lo confirma y lleva su tesorería.</div>`;
  let botones='';
  const acc=[];
  if(puedeConfirmar(P))acc.push(conf
    ?`<button class="btn ghost" onclick="devolverP(this)">Devolver para editar</button>`
    :`<button class="btn" onclick="confirmarP(this)">Confirmar y crear el evento</button>`);
  if(dueno&&!conf)acc.push(`<button class="btn ghost" onclick="abrePrestamo()">${prest?'Cambiar préstamo':'Prestar para que me ayuden'}</button>`);
  if(admin)acc.push(`<button class="btn ghost" onclick="borraPres()">Eliminar</button>`);

  if(!puedeConfirmar(P)&&puede)botones+=`<p class="hint">Cuando termines, avísale a Caro. Ella lo confirma y con eso se crea el evento.</p>`;
  return `
  <button class="volver" onclick="volverPre()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    ${volverA==='tes'?'Volver al tablero':'Volver a los presupuestos'}</button>
  ${banner}
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:8px">
      <div><div class="pcard-nom">${esc(P.nom)}</div>
        <div class="meta">${fch(P.fecha)} · lo prepara ${nomSalon(P.salon)}</div></div>
      <div style="display:flex;flex-direction:column;gap:5px;align-items:flex-end">
        <span class="badge ${conf?'closed':'open'}">${etiqueta(P)}</span>
        <span class="badge ${P.tipo==='salon'?'solo':'tipo'}">${P.tipo==='salon'?'Solo '+nomSalon(P.salon):'Toda la generación'}</span></div></div>
    <div class="field"><label>Nombre del evento</label>
      <input value="${esc(P.nom)}" ${dis} onchange="api.setPres(preId,{nom:this.value}).then(draw)"></div>
    <div class="field"><label>Fecha del evento</label>
      <input type="date" value="${P.fecha}" ${dis} onchange="api.setPres(preId,{fecha:this.value}).then(draw)"></div>
    <div class="field"><label>Quién lo llena</label>
      <input value="${esc(P.rep)}" ${dis} oninput="api.setPres(preId,{rep:this.value})"></div>
    <div class="field"><label>Niños que asisten</label>
      <button class="numbtn" ${dis} onclick="pidePres('ninos','Niños que asisten')">${P.ninos||0}</button></div>
    <div class="field"><label>Niñas que asisten</label>
      <button class="numbtn" ${dis} onclick="pidePres('ninas','Niñas que asisten')">${P.ninas||0}</button></div>
    <div class="field"><label>Adultos</label>
      <button class="numbtn" ${dis} onclick="pidePres('adultos','Adultos')">${P.adultos||0}</button></div>
    <div class="field"><label>Personas en total</label><input value="${totPersonas(P)}" disabled></div>
  </div>
  <h2>Cuenta donde se deposita</h2>
  <div class="card">
    <div class="field"><label>Banco</label>
      <input value="${esc(P.banco)}" ${dis} placeholder="BBVA" onchange="api.setPres(preId,{banco:this.value}).then(draw)"></div>
    <div class="field"><label>Nombre del titular</label>
      <input value="${esc(P.titular)}" ${dis} placeholder="A nombre de quién" onchange="api.setPres(preId,{titular:this.value}).then(draw)"></div>
    <div class="field"><label>CLABE</label>
      <input id="pre-clabe" value="${esc(P.clabe)}" ${dis} inputmode="numeric" maxlength="18"
             placeholder="18 dígitos" oninput="pintaClabe(this)" onchange="guardaClabe(this)"></div>
    <p class="hint" id="pre-clabe-nota">${textoClabe(P.clabe,true)}</p>
    <p class="hint">Es la cuenta de este evento y sale en su tablero para que las mamás depositen.</p>
  </div>
  <h2>Conceptos que se van a pagar</h2>
  <div class="card">
    <div class="conc"><span class="head">Concepto</span><span class="head" style="text-align:right">Cant.</span><span class="head" style="text-align:right">P. unit.</span><span></span></div>
    ${P.c.length?P.c.map((k,i)=>`<div class="conc">
      <input value="${esc(k.d)}" ${dis} oninput="api.setConcepto(preId,${i},'d',this.value)" aria-label="Concepto">

      <button class="numbtn" ${dis} onclick="pideConcepto(${i},'u')" aria-label="Precio unitario de ${esc(k.d)||'este concepto'}: ${mxc(k.u)}. Tócalo para cambiarlo">${mxc(k.u)}</button>
      ${puede?`<button class="del" onclick="quitaConcepto(${i})" aria-label="Quitar">×</button>`:'<span></span>'}
    </div>`).join(''):`<div class="empty">Sin conceptos todavía.</div>`}
    ${puede?`<button class="addrow" onclick="agregaConcepto(this)">Agregar concepto</button>`:''}
    <div class="result"><span>Dinero que se necesita</span><span class="v">${mx(total)}</span></div>
    <div class="result" style="border-top:1px solid var(--line)"><span>Cuota sugerida por niño</span><span class="v">${kids>0?mx(cuota):'—'}</span></div>
    ${aviso}${botones}
  </div>`;
}

/* ===== la CLABE =====

   La base exige 18 dígitos o nada (CHECK presupuestos_clabe_ok: «clabe =
   '' OR clabe ~ '^[0-9]{18}$'»), y hace bien: una CLABE a medias no
   sirve para recibir un peso, y peor si se parece a otra.

   La pantalla, en cambio, mandaba lo que hubiera escrito en cuanto el
   dedo salía del campo. Y TODA CLABE está a medias mientras se escribe.
   Resultado medido el 17-sep-2026: cinco ejecuciones con error en
   tes/presupuestos, todas iguales —

     new row for relation "presupuestos" violates check constraint
     "presupuestos_clabe_ok"
     params[14] = "2319106"        ← siete dígitos

   — y en pantalla un «No se pudo guardar el cambio» que no decía qué
   estaba mal ni cuánto faltaba.

   Las dos mitades ya decían lo mismo; lo que faltaba era que la de
   arriba lo supiera ANTES de mandar. */

const soloDigitos=v=>String(v==null?'':v).replace(/\D/g,'');

function textoClabe(v,guardada){
  const d=soloDigitos(v);
  if(d==='')return 'Puedes dejarla vacía y capturarla después.';
  if(d.length===18)return guardada?'Los 18 dígitos, guardada.':'Los 18 dígitos. Se guarda al salir del campo.';
  return `Van ${d.length} de 18 dígitos. Se guarda cuando estén los 18.`;
}

function pintaClabe(campo){
  const d=soloDigitos(campo.value);
  if(campo.value!==d)campo.value=d;          // se cae lo que no sea número
  const nota=document.getElementById('pre-clabe-nota');
  if(nota)nota.textContent=textoClabe(d,false);
}

async function guardaClabe(campo){
  const d=soloDigitos(campo.value);
  campo.value=d;
  const P=pres(preId);
  if(P&&d===soloDigitos(P.clabe))return;                 // no cambió: no se manda
  if(d!==''&&d.length!==18){
    /* Ni se manda ni se pierde: lo tecleado se queda en pantalla y la
       nota dice cuánto falta. Antes esto era un viaje al servidor que
       terminaba en un error de base de datos. */
    return toast(`La CLABE lleva 18 dígitos y van ${d.length}. Complétala y sal del campo.`);
  }
  await conAviso(()=>api.setPres(preId,{clabe:d}), d===''?'CLABE borrada.':'CLABE guardada.');
}

  const hoy=new Date().toISOString().slice(0,10),admin=ses.rol==='admin';
  modal(`<h3>Nuevo presupuesto</h3><p>Un presupuesto por evento. Lo lleva el salón que lo crea.</p>

    <div class="actions"><button class="btn ghost" data-no>Cancelar</button><button class="btn" data-si>Crear</button></div>`,
  (m,cierra)=>{
    alGuardar(m,cierra,{
      enCurso:'Creando…',

/* Agregar concepto escribía DIRECTO desde el onclick: sin botón que
   deshabilitar y sin catch. Y el renglón nuevo se empuja al arreglo
   LOCAL antes de mandarlo, así que dos toques metían dos renglones en
   blanco sin que el servidor tuviera nada que hacer al respecto — el
   duplicado nacía aquí. */
function agregaConcepto(b){
  return enBoton(b,'Agregando…',()=>api.addConcepto(preId));
}

function quitaConcepto(i){
  const k=pres(preId).c[i],nom=k.d?`"${k.d}"`:'este renglón sin nombre';
  confirmarYHacer({titulo:'Quitar concepto',
    texto:`Se va a quitar ${nom} por ${mx((k.q||0)*(k.u||0))}. El total baja de inmediato.`,
    accion:'Quitar', enCurso:'Quitando…',
    tarea:()=>api.delConcepto(preId,i), ok:'Concepto quitado.'});
}
function confirmarP(b){
  const P=pres(preId);
  if(totPres(P)<=0)return toast('No se puede confirmar un presupuesto en ceros.');
  return enBoton(b,'Confirmando…',()=>api.confirmar(preId),'Confirmado. El evento ya está en el tablero.');
}
function devolverP(b){
  // El nombre del salón se lee ANTES: después de devolver, refresca()
  // ya cambió lo que hay en DB y el aviso hablaría de otra cosa.
  const aQuien=nomSalon(pres(preId).salon);
  return enBoton(b,'Devolviendo…',()=>api.devolver(preId),'Devuelto a '+aQuien+'.');
}
function borraPres(){
  const P=pres(preId),e=eventoDe(preId);
  const extra=e?` Ojo: ya tiene evento creado con ${e.gastos.length} gasto(s). El evento se queda, pero pierde su presupuesto.`:'';
  confirmarYHacer({titulo:'Eliminar presupuesto',
    texto:`Se va a borrar "${P.nom}" por ${mx(totPres(P))}.${extra} No se puede deshacer.`,
    tarea:()=>api.delPres(preId),
    luego:()=>{preView='lista';draw()}, ok:'Presupuesto eliminado.'});
}

/* Eliminar un gasto. El botón se ofrece a quien PUEDE llegar a poder
   —tesorera general y representantes— y es el SERVIDOR el que decide
   evento por evento: la regla vive en el WHERE de gasto_eliminar, no
   aquí. A las mamás no se les ofrece porque para ellas no es "aquí no",
   es "nunca"; enseñarles un botón que siempre falla es otra forma de
   mentir. */
const puedeIntentarBorrarGasto=()=>ses.rol==='admin'||ses.rol==='rep';

function borraGasto(eId,gId){
  const e=ev(eId),g=e&&e.gastos.find(x=>x.id===gId);
  if(!g)return;
  confirmarYHacer({titulo:'Eliminar gasto',
    texto:`Se va a borrar "${g.d}" de ${g.p} por ${mx(g.m)}. El total del evento baja de inmediato y no se puede deshacer.`,
    tarea:async()=>{
      try{ await api.delGasto(eId,gId); }
      catch(err){
        /* El servidor contesta lo mismo para "no existe" y para "no es
           tuyo", a propósito. Aquí se traduce a la REGLA, que es lo que
           la persona necesita saber, sin afirmar cuál de los dos casos
           fue. */
        if(err&&err.message&&/NO_PERMITIDO|no se pudo guardar/i.test(err.message)){
          const x=new Error('No se pudo. Los gastos de un evento de generación solo los elimina la tesorera general; los de un evento de salón, la representante de ese salón.');
          x.clase='servidor';throw x;
        }
        throw err;
      }
    },
    ok:'Gasto eliminado.'});
}
</script>
